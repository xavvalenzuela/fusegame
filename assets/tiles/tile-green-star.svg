<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#77FFAA"/>
      <stop offset="55%" stop-color="#1A9944"/>
      <stop offset="100%" stop-color="#085520"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer glow -->
  <rect x="2" y="2" width="116" height="116" rx="20" fill="none" stroke="#66FF99" stroke-width="3" opacity="0.5"/>
  <rect x="6" y="9" width="108" height="108" rx="18" fill="#021A0A" opacity="0.6"/>
  <rect x="5" y="5" width="110" height="110" rx="18" fill="url(#grad)"/>
  <rect x="5" y="5" width="110" height="55" rx="18" fill="url(#gloss)"/>
  <rect x="5" y="5" width="110" height="110" rx="18" fill="none" stroke="#99FFBB" stroke-width="2" opacity="0.8"/>
  <!-- Star shape -->
  <polygon points="60,22 67,46 92,46 72,61 79,85 60,70 41,85 48,61 28,46 53,46"
           fill="white" opacity="0.95" filter="url(#glow)"/>
</svg>
