<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base radial gradient: slightly lighter center, dark edges -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2D1255"/>
      <stop offset="100%" stop-color="#0D0520"/>
    </radialGradient>

    <!-- Crystal facet pattern -->
    <pattern id="crystalPattern" x="0" y="0" width="80" height="92" patternUnits="userSpaceOnUse">
      <!-- Diamond/facet shapes tiling across background -->
      <polygon points="40,0 80,23 80,69 40,92 0,69 0,23" fill="none" stroke="#4A1A88" stroke-width="0.8" opacity="0.5"/>
      <polygon points="40,10 72,27 72,65 40,82 8,65 8,27" fill="none" stroke="#6622AA" stroke-width="0.4" opacity="0.3"/>
    </pattern>

    <!-- Sparkle glow filter -->
    <filter id="sparkleGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Base fill -->
  <rect width="390" height="844" fill="url(#bgGrad)"/>

  <!-- Crystal facet grid -->
  <rect width="390" height="844" fill="url(#crystalPattern)"/>

  <!-- Large background crystal shards (low opacity, atmospheric) -->
  <polygon points="195,0 320,120 280,300 195,360 110,300 70,120" fill="#3D1577" opacity="0.12"/>
  <polygon points="0,200 130,280 110,480 0,520" fill="#5522AA" opacity="0.08"/>
  <polygon points="390,150 260,260 290,440 390,480" fill="#5522AA" opacity="0.08"/>
  <polygon points="195,500 330,620 300,780 195,844 90,780 60,620" fill="#3D1577" opacity="0.10"/>

  <!-- Mid-layer diagonal shards -->
  <polygon points="60,0 140,0 200,180 80,140" fill="#6633BB" opacity="0.07"/>
  <polygon points="250,0 390,0 390,100 310,200" fill="#6633BB" opacity="0.07"/>
  <polygon points="0,600 120,700 60,844 0,844" fill="#6633BB" opacity="0.07"/>
  <polygon points="390,650 270,740 330,844 390,844" fill="#6633BB" opacity="0.07"/>

  <!-- Edge light streaks (subtle crystal reflection) -->
  <line x1="0" y1="180" x2="160" y2="320" stroke="#8844CC" stroke-width="1" opacity="0.15"/>
  <line x1="390" y1="220" x2="230" y2="380" stroke="#8844CC" stroke-width="1" opacity="0.15"/>
  <line x1="100" y1="0" x2="195" y2="200" stroke="#9955DD" stroke-width="0.8" opacity="0.12"/>
  <line x1="290" y1="0" x2="195" y2="200" stroke="#9955DD" stroke-width="0.8" opacity="0.12"/>
  <line x1="0" y1="500" x2="195" y2="680" stroke="#9955DD" stroke-width="0.8" opacity="0.10"/>
  <line x1="390" y1="500" x2="195" y2="680" stroke="#9955DD" stroke-width="0.8" opacity="0.10"/>

  <!-- Sparkle dots scattered -->
  <circle cx="55"  cy="95"  r="1.5" fill="white" opacity="0.5" filter="url(#sparkleGlow)"/>
  <circle cx="180" cy="55"  r="1"   fill="white" opacity="0.45"/>
  <circle cx="335" cy="130" r="1.5" fill="white" opacity="0.5" filter="url(#sparkleGlow)"/>
  <circle cx="30"  cy="340" r="1"   fill="white" opacity="0.35"/>
  <circle cx="360" cy="290" r="1.5" fill="white" opacity="0.5" filter="url(#sparkleGlow)"/>
  <circle cx="195" cy="430" r="1.2" fill="white" opacity="0.4"/>
  <circle cx="80"  cy="600" r="1.5" fill="white" opacity="0.45" filter="url(#sparkleGlow)"/>
  <circle cx="310" cy="550" r="1"   fill="white" opacity="0.4"/>
  <circle cx="145" cy="740" r="1.5" fill="white" opacity="0.5" filter="url(#sparkleGlow)"/>
  <circle cx="280" cy="780" r="1"   fill="white" opacity="0.4"/>
  <circle cx="370" cy="700" r="1.5" fill="white" opacity="0.45"/>
  <circle cx="20"  cy="780" r="1"   fill="white" opacity="0.35"/>

  <!-- Vignette overlay -->
  <rect width="390" height="844" fill="url(#vignette)"/>
</svg>
