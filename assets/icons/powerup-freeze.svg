<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A4A7A"/>
      <stop offset="100%" stop-color="#0A1E3A"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon background -->
  <rect width="64" height="64" rx="12" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="12" fill="none" stroke="#66BBFF" stroke-width="1.5" opacity="0.6"/>

  <!-- Snowflake: center dot -->
  <circle cx="32" cy="32" r="3.5" fill="#AADDFF" filter="url(#glow)"/>

  <!-- 6 main arms -->
  <g stroke="#AADDFF" stroke-width="2" stroke-linecap="round" filter="url(#glow)">
    <!-- Vertical -->
    <line x1="32" y1="10" x2="32" y2="54"/>
    <!-- 60° -->
    <line x1="51.1" y1="21" x2="12.9" y2="43"/>
    <!-- 120° -->
    <line x1="51.1" y1="43" x2="12.9" y2="21"/>
  </g>

  <!-- Branch ticks on each arm -->
  <g stroke="#AADDFF" stroke-width="1.5" stroke-linecap="round" opacity="0.85">
    <!-- Top arm branches -->
    <line x1="32" y1="18" x2="27" y2="13"/>
    <line x1="32" y1="18" x2="37" y2="13"/>
    <!-- Bottom arm branches -->
    <line x1="32" y1="46" x2="27" y2="51"/>
    <line x1="32" y1="46" x2="37" y2="51"/>
    <!-- Upper right branches -->
    <line x1="44.5" y1="24.5" x2="48" y2="18.5"/>
    <line x1="44.5" y1="24.5" x2="50.5" y2="27"/>
    <!-- Lower left branches -->
    <line x1="19.5" y1="39.5" x2="16" y2="45.5"/>
    <line x1="19.5" y1="39.5" x2="13.5" y2="37"/>
    <!-- Upper left branches -->
    <line x1="19.5" y1="24.5" x2="16" y2="18.5"/>
    <line x1="19.5" y1="24.5" x2="13.5" y2="27"/>
    <!-- Lower right branches -->
    <line x1="44.5" y1="39.5" x2="48" y2="45.5"/>
    <line x1="44.5" y1="39.5" x2="50.5" y2="37"/>
  </g>

  <!-- Tip dots -->
  <g fill="#DDEEFF" opacity="0.9">
    <circle cx="32" cy="10" r="1.5"/>
    <circle cx="32" cy="54" r="1.5"/>
    <circle cx="51.1" cy="21" r="1.5"/>
    <circle cx="12.9" cy="43" r="1.5"/>
    <circle cx="51.1" cy="43" r="1.5"/>
    <circle cx="12.9" cy="21" r="1.5"/>
  </g>
</svg>
